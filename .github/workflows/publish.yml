name: Publish @zmdb packages to npm

on:
  workflow_dispatch:
    inputs:
      release:
        description: all, core or one independent catalog id
        required: true
        default: all
        type: string
      version:
        description: Exact prepared release version
        required: true
        type: string
  push:
    tags:
      - 'v*'
      - 'core-v*'
      - '*-v*'

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require successful CI for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq 'length')
          test "$count" -eq 1

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        env:
          COREPACK_ENABLE_PROJECT_SPEC: '0'
        run: npm install -g npm@latest

      - name: Install
        run: yarn install --immutable

      - name: Resolve the prepared release
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_RELEASE" = "all" ]; then
              RELEASE_TAG="v${REQUESTED_VERSION}"
            else
              RELEASE_TAG="${REQUESTED_RELEASE}-v${REQUESTED_VERSION}"
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          node scripts/release/plan.mjs --tag "$RELEASE_TAG" --json > "$RUNNER_TEMP/zmdb-release-plan.json"
          node scripts/release/plan.mjs --tag "$RELEASE_TAG" --publish-tsv > "$RUNNER_TEMP/zmdb-publish-order.tsv"

      - name: Build packages
        run: yarn build

      - name: Publish staged packages (or pack on manual dispatch)
        env:
          COREPACK_ENABLE_PROJECT_SPEC: '0'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          VER=$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).version)" "$RUNNER_TEMP/zmdb-release-plan.json")
          CHANNEL=$(node --input-type=module -e 'import { releaseChannel } from "./scripts/release/lib.mjs"; console.log(releaseChannel(process.argv[1]))' "$VER")
          while IFS=$'\t' read -r directory package_name; do
            args=(--directory "$directory" --package "$package_name" --version "$VER"
              --pack-destination "$RUNNER_TEMP/zmdb-release-tarballs")
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              node .github/scripts/publish-package.mjs "${args[@]}" --tag "$CHANNEL" --dry-run
            else
              node .github/scripts/publish-package.mjs "${args[@]}" --tag "$CHANNEL"
              if [ "$GITHUB_REF_NAME" = "v1.0.0-beta.2" ]; then
                npm dist-tag add "$package_name@$VER" latest
              fi
            fi
          done < "$RUNNER_TEMP/zmdb-publish-order.tsv"

      - name: Retain prepared packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-packages
          path: ${{ runner.temp }}/zmdb-release-tarballs/*.tgz

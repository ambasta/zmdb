name: Deploy docs + benchmarks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # The dashboard renders benchmarks/site/*.json, and the landing-page stats
      # are derived from the same files, so new measurements must redeploy.
      - 'benchmarks/site/**'
      - 'benchmarks/RESULTS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: yarn` resolves the cache directory by
      # shelling out to the global `yarn`, which is 1.x on the runner and exits
      # non-zero against this repo's `packageManager: yarn@4`.
      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      # The build imports @zmdb/schema-core and @zmdb/aot-validator to derive
      # site/openapi.json from real schema definitions, so it needs the
      # workspace symlinks. Without this the build dies on ERR_MODULE_NOT_FOUND.
      - name: Install
        run: yarn install --immutable

      # `--import`: the packages' sources import their siblings as `./x.js`, which
      # only `tsc` and vitest resolve to `./x.ts` on their own. See the hook.
      - name: Build docs site (docs at root, benchmarks at /benchmarks/)
        run: node --import ./scripts/ts-specifier-hook.mjs docs-site/build.mjs
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

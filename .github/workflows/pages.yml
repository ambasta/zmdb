name: Deploy docs + benchmarks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # The dashboard renders benchmarks/site/*.json, and the landing-page stats
      # are derived from the same files, so new measurements must redeploy.
      - 'benchmarks/site/**'
      - 'benchmarks/RESULTS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Must precede setup-node: `cache: yarn` resolves the cache directory by
      # shelling out to the global `yarn`, which is 1.x on the runner and exits
      # non-zero against this repo's `packageManager: yarn@4`.
      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'yarn'

      # The docs build derives site/openapi.json from public workspace APIs,
      # so installation must establish the workspace package links.
      - name: Install
        run: yarn install --immutable

      - name: Verify generated package and integration docs
        run: yarn verify:docs-generated

      - name: Compile documentation samples
        run: yarn verify:docs-samples

      - name: Build docs site (docs at root, benchmarks at /benchmarks/)
        run: yarn build:docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

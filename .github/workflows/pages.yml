name: Deploy docs + benchmarks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # The dashboard renders benchmarks/site/*.json, and the landing-page stats
      # are derived from the same files, so new measurements must redeploy.
      - 'benchmarks/site/**'
      - 'benchmarks/RESULTS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node: `cache: yarn` resolves the cache directory by
      # shelling out to the global `yarn`, which is 1.x on the runner and exits
      # non-zero against this repo's `packageManager: yarn@4`.
      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'yarn'

      # The docs build derives site/openapi.json from public workspace APIs,
      # so installation must establish the workspace package links.
      - name: Install
        run: yarn install --immutable

      - name: Build docs site (docs at root, benchmarks at /benchmarks/)
        run: yarn build:docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Typecheck + Test + Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn fmt:check

      # `yarn typecheck` discovers packages/*/tsconfig.json (plus benchmarks), so
      # a new package is covered without editing this file. The hand-maintained
      # loop it replaced listed four packages and skipped `web` and `zmdb`.
      # Specs and `*.type-test.ts` files are inside the program, so the
      # type-level assertions (Equal/Expect, @ts-expect-error) are gated here.
      - name: Typecheck (all projects, incl. specs and type-tests)
        run: yarn typecheck

      - name: Verify export manifests
        run: yarn verify:exports

      - name: Unit + integration tests (incl. node:sqlite E2E)
        run: yarn vitest run

      # Benchmarks run as part of the vitest suite (validation + ORM, plus the
      # Kysely head-to-head and the RESULTS.md generator). The report generator
      # enforces the honesty policy (assertNoSilentSkips) — an in-scope case
      # missing from the results fails the build.
      - name: Publish benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/RESULTS.md

  docs:
    name: Documentation Site Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Verify competitor docs coverage
        run: yarn verify:docs-coverage

      - name: Build docs site
        run: yarn build:docs

      - name: Publish OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: site/openapi.json

  spec-validation:
    name: Specification Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Validate specifications
        run: yarn validate:spec

  regression-guardrail:
    name: Benchmark regression guardrail
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable
      # The guardrail unit tests assert the ok→DNF and throughput-drop detection
      # logic. A real pipeline would diff the freshly-generated RESULTS.md
      # against the committed baseline using checkRegressions() and fail on any
      # regression; here we run the guardrail test suite as the gate.
      - name: Guardrail checks
        run: yarn guardrail

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Audit dependencies
        run: yarn npm audit --all --recursive --severity high --no-deprecations

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

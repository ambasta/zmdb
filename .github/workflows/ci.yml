name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable --check-cache

      - name: Capture native issue relationships
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/roadmap/native-relationships.mjs --json > "$RUNNER_TEMP/zmdb-native-relationships.json"

      - name: Verify the composed architecture, exception, and release governance snapshot
        run: yarn verify:governance --relationships "$RUNNER_TEMP/zmdb-native-relationships.json"

      - name: Verify package metadata and release-policy projections
        run: yarn verify:package-metadata

      - name: Verify release units, changelog, and publish order
        run: yarn verify:release-governance

      # The root config loads @zmdb/compiler/lint through its source adapter and enables
      # the complete recommended config. This is one oxlint invocation, not a second linter pass.
      - name: Lint (oxlint + zmdb recommended rules)
        run: yarn lint

      - name: Format check
        run: yarn fmt:check

      # `yarn typecheck` discovers packages/*/tsconfig.json (plus benchmarks), so
      # a new package is covered without editing this file. The hand-maintained
      # loop it replaced listed four packages and skipped `web` and `zmdb`.
      # Specs and `*.type-test.ts` files are inside the program, so the
      # type-level assertions (Equal/Expect, @ts-expect-error) are gated here.
      - name: Typecheck (all projects, incl. specs and type-tests)
        run: yarn typecheck

      - name: Verify export manifests
        run: yarn verify:exports

      - name: Verify runtime, tooling, and optional-peer reachability
        run: yarn verify:runtime-reachability

      - name: Verify tooling package ownership and runtime isolation
        run: node .github/scripts/verify-tooling-boundaries.mjs

      - name: Verify official product membership and facade ownership
        run: yarn verify:product-catalog

      - name: Verify architecture zones, rings, and workspace edges
        run: yarn verify:architecture-zones

      # `verify:exports` runs inside the workspace, where `node_modules/@zmdb/*` is a
      # symlink and Node resolves past it — so it can pass for a package that cannot be
      # imported once installed. This builds, packs, installs into a throwaway project,
      # and imports and typechecks every subpath from there. It belongs in CI rather than
      # only in the release workflow: a broken manifest should fail the pull request that
      # broke it, not the tag six commits later.
      - name: Verify the packages install and load as published
        run: yarn verify:publish

      - name: Start strict utf8mb4 MySQL for the packed @zmdb/mysql consumer
        run: |
          docker run --detach --name zmdb-issue-671-mysql-ci \
            --env MYSQL_ROOT_PASSWORD=zmdb671 \
            --env MYSQL_DATABASE=zmdb671 \
            --publish 3306:3306 \
            mysql:8.4.11 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_0900_ai_ci \
            --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION
          for attempt in $(seq 1 60); do
            if docker exec zmdb-issue-671-mysql-ci mysqladmin ping --password=zmdb671 --silent; then
              exit 0
            fi
            sleep 1
          done
          docker logs zmdb-issue-671-mysql-ci
          exit 1

      - name: Verify the packed MySQL consumer against the real server
        env:
          ZMDB_MYSQL_URL: mysql://root:zmdb671@127.0.0.1:3306/zmdb671
        run: yarn verify:mysql-live

      - name: Remove the issue 671 MySQL service
        if: always()
        run: docker rm --force zmdb-issue-671-mysql-ci || true

      # The builder DSL is gone. This imports every published subpath and reads its export
      # names, so a builder cannot come back through a re-export, and it scans for callers
      # including files not yet committed. What it replaces is `verify:codemod`, which
      # counted the schemas in this repository the codemod could convert: a useful number
      # while the migration was in progress and a vacuous one now that the count is zero.
      # The codemod is still tested against its corpora, by `codemod.spec.ts`, line for line.
      - name: Verify a schema is a type
        run: yarn verify:no-defineschema

      # A tag nothing reads is a tag that compiles, derives correctly, and is quietly missing
      # from the emitted validator. The type test next to it gates what a type can state;
      # this gates the links between the tags, the IR and the reflection (REQ-TF-1).
      - name: Verify the tag vocabulary is covered end to end
        run: yarn verify:tf-coverage

      # The consumer pays for the derivation on every build, and nothing fails when a build
      # gets slower — it just gets slower. Measured against the same schema with every tag
      # stripped, which is REQ-TF-3's baseline, at a scale where a cross-product shows (RISK-6).
      - name: Verify what the tags cost the compiler
        run: yarn verify:instantiations

      # Loading a project is the expensive part of asking the compiler anything, so a codegen
      # that reloaded per file would cost more than the validator it produces ever saves — and
      # would pass every correctness test in the repository. One compiler for a 64-module build,
      # and a snapshot-update log that is the same at 8 modules as at 64 (REQ-TF-11).
      - name: Verify the build pays the checker once
        run: yarn verify:build-budget

      # A descriptor is the shape of a type written out again by hand, in a form the compiler
      # cannot check against the type it claims to describe. The witness is generated now, and
      # this is what keeps it that way (REQ-TF-9).
      - name: Verify no hand-written descriptors
        run: yarn verify:no-descriptors

      # Four back-ends each took a column's SQL type and its rules and decided privately what a
      # value of it looks like, and no two agreed about a `timestamp`. They are one walk now, and
      # a fifth arrived in the seeder while nothing was watching — so this watches: who may name
      # the metadata vocabulary, who may read a column's flags or rules, and the deleted walkers
      # by name.
      - name: Verify there is one walker over column metadata
        run: yarn verify:one-walker

      # The builder intentionally admits database-specific comparison operators, so a closed
      # operator allowlist would break real SQL. This keeps the one open-string boundary in
      # clauses.ts, where sqlOperator constrains it to one token before it reaches SQL text.
      - name: Verify there is one comparison-operator SQL boundary
        run: yarn verify:operator-boundary

      # And the audit of the requirement table itself: every REQ-TF acceptance criterion
      # has to name a test or a gate that exists, whose cited test names still exist, and
      # whose gates this file actually runs. A row nobody can execute is a claim.
      - name: Verify every REQ-TF criterion names a live enforcer
        run: yarn verify:tf-acceptance

      # `verify:docs-coverage` checks the replacement claim against what Drizzle, Kysely,
      # MikroORM, NestJS and Typia *document*. This checks it against what they *test*, which is
      # the stronger half: a documented feature with no test is a promise, a tested one is a
      # behaviour someone depends on. Every upstream suite in the pinned inventory either names a
      # zmdb test or carries a written argument for why we do not want it.
      #
      # `scripts/harvest-api-tests.mjs` is what re-pins the inventory, and it is deliberately not
      # run here: it clones five repositories, and an upstream landing a test at 3am should not
      # turn our build red.
      - name: Verify competitor API-test coverage
        run: yarn verify:api-coverage

      # PRD §9.4's table, recomputed. The published assertion count had already drifted up by
      # five with nothing watching, which is what a document-as-invariant gets you (RISK-7).
      - name: Verify the escape-hatch ratchet
        run: yarn verify:escape-hatches

      # The two zmdb rows in the validation benchmark are generated from one interface. A
      # stale generated file means the published numbers describe a shape nobody declared.
      - name: Verify the generated validation model is current
        run: yarn bench:validation:generate:check

      # `fixtures/consumer-cli/` has its generated validator committed, the way a project that
      # runs no-bundler project compilation in a pre-commit hook would. This exercises the
      # repository-only compiler wrapper in check mode and writes nothing.
      - name: Verify the committed no-bundler fixture is current
        run: yarn verify:fixtures
      - name: Unit + integration tests (incl. node:sqlite E2E)
        run: yarn vitest run

  server-integration-consumers:
    name: Installed optional server integrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bench
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      nats:
        image: nats:2.12-alpine
        ports:
          - 4222:4222
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Start CockroachDB 26.2.2
        run: |
          docker run --detach --name zmdb-cockroach-ci \
            --publish 26257:26257 --publish 8080:8080 \
            cockroachdb/cockroach:v26.2.2 \
            start-single-node --insecure \
            --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 30); do
            if docker exec zmdb-cockroach-ci cockroach sql --insecure --execute 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs zmdb-cockroach-ci
          exit 1

      - name: Pack, install, typecheck, and execute every optional server integration
        env:
          ZMDB_COCKROACH_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
          ZMDB_NATS_URL: nats://127.0.0.1:4222
          ZMDB_PG: postgres://postgres:postgres@127.0.0.1:5432/bench
          ZMDB_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/bench
          ZMDB_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
          ZMDB_REDIS_URL: redis://127.0.0.1:6379
        run: |
          yarn verify:server-integrations
          yarn verify:database-cockroach
          yarn verify:database-postgres

      - name: Stop CockroachDB
        if: always()
        run: docker rm --force zmdb-cockroach-ci || true

  mssql-acceptance:
    name: Packed SQL Server acceptance
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Zmdb672!CiAcceptance2026
        ports:
          - 1433:1433
    env:
      ZMDB_MSSQL_URL: Server=localhost,1433;Database=master;User Id=sa;Password=Zmdb672!CiAcceptance2026;Encrypt=true;TrustServerCertificate=true
      ZMDB_MSSQL_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Verify the workspace SQL Server vertical
        run: yarn vitest run packages/mssql/src/live.spec.ts

      - name: Build, pack, install and run the SQL Server consumer
        run: yarn verify:mssql-acceptance

  singlestore-acceptance:
    name: Packed SingleStore acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Start the official SingleStore Dev Image
        run: |
          docker volume create zmdb-issue-674-singlestore-ci-data
          docker run --detach --name zmdb-issue-674-singlestore-ci \
            --env ROOT_PASSWORD=zmdb674 \
            --publish 3306:3306 \
            --volume zmdb-issue-674-singlestore-ci-data:/var/lib/memsql \
            ghcr.io/singlestore-labs/singlestoredb-dev@sha256:7ad84887a8a3e0bb1574e38886ff9893b01a4906414bfd105850e740306422fa
          for attempt in $(seq 1 90); do
            if docker exec zmdb-issue-674-singlestore-ci \
              bash -lc "singlestore -uroot -pzmdb674 -e 'SELECT 1'" >/dev/null 2>&1; then
              docker exec zmdb-issue-674-singlestore-ci \
                bash -lc "singlestore -uroot -pzmdb674 -e 'CREATE DATABASE IF NOT EXISTS zmdb674'"
              exit 0
            fi
            sleep 2
          done
          docker logs zmdb-issue-674-singlestore-ci
          exit 1

      - name: Build, pack, install and run the SingleStore consumer
        env:
          ZMDB_SINGLESTORE_URL: mysql://root:zmdb674@127.0.0.1:3306/zmdb674
        run: yarn verify:singlestore-live

      - name: Remove the issue 674 SingleStore service and volume
        if: always()
        run: |
          docker rm --force zmdb-issue-674-singlestore-ci || true
          docker volume rm --force zmdb-issue-674-singlestore-ci-data || true

  docs:
    name: Documentation Site Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable --check-cache

      - name: Verify competitor docs coverage
        run: yarn verify:docs-coverage

      - name: Verify generated package and integration docs
        run: yarn verify:docs-generated

      - name: Build docs site
        run: yarn build:docs

      - name: Publish OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d5ee3f0750267 # v4.4.3
        with:
          name: openapi-spec
          path: site/openapi.json

  spec-validation:
    name: Specification Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable --check-cache

      - name: Validate specifications
        run: yarn validate:spec

  # No job here measures anything. A GitHub runner is a shared, unspecified VM,
  # so a number produced on one is not worth committing and a throughput
  # threshold against one fails on runner variance rather than on a regression.
  # Benchmarks are run locally (`yarn bench`, which grafts into the upstream
  # submodules first and so fails there if a patch has stopped applying); the
  # resulting JSON is committed and this job checks it. The graft itself is not
  # re-run here: the verifier's upstreamCommit check is what catches a submodule
  # bump, because bumping one invalidates the committed numbers and so forces a
  # local re-run. See benchmarks/harness/README.md.
  bench-results:
    name: Committed benchmark results
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No `submodules:` — the verifier reads the pinned commits out of the
      # gitlinks in the tree, which is enough to catch results measured against
      # an upstream we have since bumped.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'

      # Run directly rather than through `yarn verify:bench`: the script imports
      # only benchmarks/src and node builtins, so it needs no install, and
      # `yarn run` wants the node_modules state file. The `--import` is the same
      # resolve hook that script gets through `yarn`, and it needs no install either.
      - name: Verify committed benchmark results
        run: node --import ./scripts/ts-specifier-hook.mjs .github/scripts/verify-bench-results.mjs

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'

      - name: Audit dependencies
        # Metro 0.87.0 is the current release and is used only by the committed
        # React Native fixture. It resolves image-size@1.2.1; npm's current
        # image-size@2.0.2 is still covered by these two denial-of-service
        # advisories, so no fixed version exists to select. Keep every other
        # high advisory fatal and name the exact temporary exceptions.
        run: >
          yarn npm audit --all --recursive --severity high --no-deprecations
          --ignore 1138808 --ignore 1138809

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@df702c286542718ef55d6141a0e9b97b09c25679 # v3.28.11
        with:
          languages: javascript-typescript

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Use Node 26
        uses: actions/setup-node@39370e3970a6d050c08020d0f489f44926987015 # v4.1.0
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --check-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@df702c286542718ef55d6141a0e9b97b09c25679 # v3.28.11

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@836484a0c8d1e3d67f5cfc1d471be84ef9b8e23a # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
